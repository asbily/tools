<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Asbily Tools</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #090909;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 440px;
        width: 100%;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 20px;
        padding: 32px;
        background: #f6f6f6;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 8px;
        background: #000000;
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 800;
      }
      p {
        margin: 0 0 22px;
        font-size: 14px;
        line-height: 1.6;
        color: #525252;
      }
      button {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #000000;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Offline Mode</span>
      <h1>You are currently offline</h1>
      <p>
        This page has not been cached on your device yet. Reconnect to the internet to load uncached routes, or return to the cached Asbily Tools home screen.
      </p>
      <button type="button" onclick="window.location.href='/'">Return to Asbily Tools</button>
    </main>
  </body>
</html>
